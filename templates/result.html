{% extends "base.html" %}

{% block title %}Session QR Code{% endblock %}

{% block content %}
  <div class="qr-result-page" style="text-align: center;">
    <h2>Scan or Tap the QR Code Below</h2>
    <div id="qr-container">
      <!-- Loading state -->
      <div id="loading-state" class="state-message">
        <div class="spinner"></div>
        <p>Generating your QR code...</p>
      </div>
      
      <!-- Success state (hidden initially) -->
      <div id="success-state" class="state-message" style="display: none;">
        <img id="qr-image" src="" alt="Session QR Code" class="qr-image">
        <div class="qr-actions">
          <a id="download-link" href="" class="download-button" download="session_qr.png">
            Download QR Code
          </a>
        </div>
      </div>
      
      <!-- Error state (hidden initially) -->
      <div id="error-state" class="state-message" style="display: none;">
        <p class="error-text">Failed to load QR code.</p>
        <button id="retry-button" class="retry-button">Try Again</button>
      </div>
    </div>
  </div>

  <style>
    .qr-image {
      width: 300px;
      height: 300px;
      border: 1px solid #ddd;
      padding: 10px;
      background: white;
    }
    .state-message {
      margin: 20px 0;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3498db;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .download-button, .retry-button {
      display: inline-block;
      padding: 10px 20px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 15px;
    }
    .error-text {
      color: #e74c3c;
    }
  </style>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const loadingState = document.getElementById('loading-state');
    const successState = document.getElementById('success-state');
    const errorState = document.getElementById('error-state');
    const qrImage = document.getElementById('qr-image');
    const downloadLink = document.getElementById('download-link');
    const retryButton = document.getElementById('retry-button');

    function displayQR() {
      const qrUrl = localStorage.getItem('qrUrl');
      
      if (qrUrl) {
        // Add cache busting parameter if not already present
        const finalUrl = qrUrl.includes('?') ? qrUrl : `${qrUrl}?t=${new Date().getTime()}`;
        
        qrImage.src = finalUrl;
        downloadLink.href = finalUrl;
        
        qrImage.onload = function() {
          loadingState.style.display = 'none';
          successState.style.display = 'block';
        };
        
        qrImage.onerror = function() {
          console.error('Failed to load QR image:', finalUrl);
          loadingState.style.display = 'none';
          errorState.style.display = 'block';
        };
      } else {
        console.error('No QR URL found in localStorage');
        loadingState.style.display = 'none';
        errorState.style.display = 'block';
      }
    }

    // Initial attempt
    displayQR();

    // Retry functionality
    retryButton.addEventListener('click', function() {
      errorState.style.display = 'none';
      loadingState.style.display = 'block';
      displayQR();
    });
  });
</script>
{% endblock %}
