{% extends "base.html" %}

{% block title %}Session QR Code{% endblock %}

{% block content %}
  <div class="qr-result-page">
    <h2>Scan or Tap the QR Code Below</h2>
    <a href="{{ url_for('download_page', session_id=session_id) }}">
      <img src="{{ url_for('static', filename='results/' + session_id + '/qr.png') }}" alt="Download QR" style="width: 300px; height: 300px;">
    </a>
  </div>
{% endblock %}
