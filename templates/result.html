{% extends "base.html" %}

{% block title %}Session QR Code{% endblock %}

{% block content %}
<div class="qr-result-page" style="text-align: center;">
  <h2>Scan or Tap the QR Code Below</h2>
  
  <div id="qr-container">
    <!-- Loading State -->
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Generating your QR code...</p>
      <p id="loading-details" style="font-size: 0.8em; color: #666;"></p>
    </div>
    
    <!-- Success State (hidden initially) -->
    <div id="success-state" style="display: none;">
      <img id="qr-image" src="" alt="Session QR Code" style="width: 300px; height: 300px;">
      <div style="margin-top: 15px;">
        <a id="download-link" href="" class="button" download="session_qr.png">
          Download QR Code
        </a>
      </div>
    </div>
    
    <!-- Error State (hidden initially) -->
    <div id="error-state" style="display: none;">
      <p style="color: #e74c3c;">Failed to load QR code.</p>
      <button id="retry-button" class="button">Try Again</button>
      <p id="error-details" style="font-size: 0.8em; color: #666;"></p>
    </div>
  </div>
</div>

<style>
  .spinner {
    border: 4px solid rgba(0, 0, 0, 0.1);
    border-radius: 50%;
    border-top: 4px solid #3498db;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .button {
    display: inline-block;
    padding: 8px 16px;
    background: #3498db;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
</style>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const loadingState = document.getElementById('loading-state');
  const successState = document.getElementById('success-state');
  const errorState = document.getElementById('error-state');
  const qrImage = document.getElementById('qr-image');
  const downloadLink = document.getElementById('download-link');
  const retryButton = document.getElementById('retry-button');
  const loadingDetails = document.getElementById('loading-details');
  const errorDetails = document.getElementById('error-details');

  // Debugging info
  loadingDetails.textContent = `Session ID: ${localStorage.getItem('sessionId') || 'none'}`;

  function loadQRCode() {
    const qrUrl = localStorage.getItem('qrUrl');
    console.log('Attempting to load QR from:', qrUrl); // Debug log

    if (!qrUrl) {
      showError('No QR code URL found in storage');
      return;
    }

    // Create new image element to test load
    const testImage = new Image();
    testImage.onload = function() {
      // Only set the source if image loads successfully
      qrImage.src = qrUrl;
      downloadLink.href = qrUrl;
      loadingState.style.display = 'none';
      successState.style.display = 'block';
      console.log('QR code loaded successfully');
    };
    testImage.onerror = function() {
      showError(`Failed to load QR image from URL: ${qrUrl}`);
      console.error('Image load error', {
        url: qrUrl,
        localStorage: localStorage.getItem('qrUrl')
      });
    };
    testImage.src = qrUrl;
  }

  function showError(message) {
    loadingState.style.display = 'none';
    errorState.style.display = 'block';
    errorDetails.textContent = message;
    console.error(message);
  }

  // Initial load attempt
  loadQRCode();

  // Retry functionality
  retryButton.addEventListener('click', function() {
    errorState.style.display = 'none';
    loadingState.style.display = 'block';
    loadQRCode();
  });

  // Fallback: If still loading after 10 seconds, show error
  setTimeout(() => {
    if (loadingState.style.display !== 'none') {
      showError('Timeout while loading QR code. The server might be taking too long to respond.');
    }
  }, 10000);
});
</script>
{% endblock %}
