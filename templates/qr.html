<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Get your QR</title>
<body style="font-family:sans-serif;text-align:center;margin-top:40px">
  <h2>Get your QR code</h2>

  <form method="post">
    <input name="student_id" placeholder="Student ID" required>
    <input name="surname" placeholder="Surname" required>
    <button type="submit">Generate QR</button>
  </form>

  {% if qr_data %}
    <p>Show this to the scanner:</p>
    <img src="data:image/png;base64,{{ qr_data }}" width="300">
    <p>
      <a download="my_qr.png" href="data:image/png;base64,{{ qr_data }}">Save QR to phone</a>
      &nbsp;|&nbsp;
      <a href="/scan">Go to scanner</a>
    </p>
  {% endif %}
</body>
