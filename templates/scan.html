{% extends "base.html" %}

{% block title %}Scanning QR ID{% endblock %}

{% block content %}

<div class="qr-scanner">
    <div id="reader" class="qr-scan" style="width: 500px;"></div>

    <p class="instruction">Align QR code within the frame</p>
</div>


<script>
function onScanSuccess(decodedText) {
    const [student_id, surname] = decodedText.split(',');

    fetch('/start_session', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ student_id, surname })
    })
    .then(res => res.json())
    .then(data => {
        const session_id = data.session_id;
        window.location.href = `/select?session_id=${data.session_id}`;
    });
}

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
        );
</script>
{% endblock %}
