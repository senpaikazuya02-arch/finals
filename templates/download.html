{% extends "base.html" %}

{% block title %}Download Your Photos{% endblock %}

{% block content %}
  <div class="download-content">
    <h1>Your Session Photos</h1>
    <div>
      {% for url in photos %}
        <div class="download-content">
          <img src="{{ url }}" width="200"><br>
          <a href="{{ url }}" download>
            Download Photo {{ loop.index }}
          </a>
          <img src="{{ final_url }}" alt="Photostrip" width="400"><br><br>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
