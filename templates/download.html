{% extends "base.html" %}

{% block title %}Download Your Photos{% endblock %}

{% block content %}
  <div class="download-content">
    <h1>Your Session Photos</h1>
    <div>
      {% for i in range(1, 5) %}
        <div style="margin-bottom: 15px;">
          <img src="{{ url_for('static', filename='results/' + session_id + '/photo_' ~ i ~ '.jpg') }}" width="200"><br>
          <a href="{{ url_for('static', filename='results/' + session_id + '/photo_' ~ i ~ '.jpg') }}" download>
            Download Photo {{ i }}
          </a>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
