{% extends "base.html" %}

{% block content %}
<h1>Your Session</h1>
<img src="{{ qr_url }}" alt="QR for later">
<div>
  {% for url in photo_urls %}
    <img src="{{ url }}" width="200"><br>
    <a href="{{ url }}" download>Download Photo</a><br><br>
  {% endfor %}
</div>
{% endblock %}

{% block scripts %}
<script>
  const photoUrls = JSON.parse(localStorage.getItem('photoUrls') || '[]');
  const qrUrl = localStorage.getItem('qrUrl');

  if (qrUrl) {
    document.querySelector('img[alt="QR for later"]').src = qrUrl;
  }

  const container = document.querySelector('div');
  photoUrls.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.width = 200;
    container.appendChild(img);

    const link = document.createElement('a');
    link.href = url;
    link.download = 'photo.png';
    link.textContent = 'Download Photo';
    container.appendChild(link);
    container.appendChild(document.createElement('br'));
  });
</script>
{% endblock %}
